name: 💡 Feature request
description: Suggest a feature, a format or a language for freeupscale
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem behind the idea helps more than the solution alone.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How you imagine it working.
